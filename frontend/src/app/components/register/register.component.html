<header class="app-header">
  <a routerLink="/" class="logo">🏟️ SportSphere Hub</a>
  <nav>
    <a routerLink="/">Početna</a>
    <a routerLink="/login">Prijava</a>
  </nav>
</header>

<div class="container" style="max-width:700px;margin:20px auto">
  <div class="card">
    <h2 style="text-align:center;margin-bottom:20px">📝 Registracija</h2>

    <div *ngIf="errorMsg" class="alert alert-error">{{ errorMsg }}</div>
    <div *ngIf="successMsg" class="alert alert-success">{{ successMsg }}</div>

    <div class="form-group">
      <label>Registrujem se kao:</label>
      <select [(ngModel)]="role" (change)="onRoleChange()">
        <option value="athlete">Sportista</option>
        <option value="employee">Zaposleni u sportskom objektu</option>
      </select>
    </div>

    <div class="grid-2">
      <div class="form-group">
        <label>Korisničko ime *</label>
        <input type="text" [(ngModel)]="username" placeholder="jedinstveno">
      </div>
      <div class="form-group">
        <label>Email *</label>
        <input type="email" [(ngModel)]="email" placeholder="email@example.com">
      </div>
      <div class="form-group">
        <label>Lozinka *</label>
        <input type="password" [(ngModel)]="password" placeholder="8-12 karaktera">
        <div style="font-size:0.75rem;color:var(--text-light)">8-12 karaktera, počinje slovom, bar 1 veliko slovo, 1 broj, 1 specijalni karakter</div>
      </div>
      <div class="form-group"><label>Ime *</label><input type="text" [(ngModel)]="firstName"></div>
      <div class="form-group"><label>Prezime *</label><input type="text" [(ngModel)]="lastName"></div>
      <div class="form-group"><label>Kontakt telefon *</label><input type="text" [(ngModel)]="contactPhone"></div>
    </div>

    <div class="form-group">
      <label>Profilna slika</label>
      <div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap">
        <input type="file" accept="image/*" (change)="onFileSelected($event)" style="max-width:250px">
        <button type="button" class="btn btn-outline btn-sm" (click)="generateAvatar()">🎲 Generiši avatar</button>
        <button type="button" class="btn btn-sm btn-outline" (click)="removeImage()">✕ Ukloni</button>
      </div>
      <img *ngIf="avatarPreview" [src]="avatarPreview" class="avatar-preview" style="margin-top:8px;width:100px;height:100px">
    </div>

    <div class="form-group" *ngIf="role === 'athlete'">
      <label>Omiljeni sportovi (max 5, drži Ctrl za višestruki izbor)</label>
      <select multiple [(ngModel)]="favoriteSports">
        <option value="Tenis">Tenis</option>
        <option value="Fudbal">Fudbal</option>
        <option value="Košarka">Košarka</option>
        <option value="Odbojka">Odbojka</option>
        <option value="Plivanje">Plivanje</option>
        <option value="Stoni tenis">Stoni tenis</option>
        <option value="Badminton">Badminton</option>
        <option value="Teretana">Teretana</option>
        <option value="Joga">Joga</option>
      </select>
    </div>

    <div *ngIf="role === 'employee'">
      <div class="grid-2">
        <div class="form-group"><label>Naziv sportskog objekta *</label><input type="text" [(ngModel)]="facilityName"></div>
        <div class="form-group"><label>Adresa sedišta *</label><input type="text" [(ngModel)]="facilityAddress"></div>
        <div class="form-group"><label>Matični broj (8 cifara) *</label><input type="text" [(ngModel)]="registrationNumber" placeholder="12345678"></div>
        <div class="form-group"><label>PIB (9 cifara, ne počinje nulom) *</label><input type="text" [(ngModel)]="pib" placeholder="123456789"></div>
      </div>
    </div>

    <button class="btn btn-primary btn-block btn-lg" (click)="register()" [disabled]="loading">
      {{ loading ? 'Registracija...' : 'Registruj se' }}
    </button>
  </div>
</div>

<footer class="app-footer">
  <p>&copy; 2025 SportSphere Hub. Studentski projekat - ETF Beograd.</p>
</footer>
