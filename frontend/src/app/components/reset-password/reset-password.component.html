<header class="app-header">
  <a routerLink="/" class="logo">SportSphere Hub</a>
  <nav><a routerLink="/login">Prijava</a></nav>
</header>

<div class="container-sm">
  <div class="card">
    <h2 style="text-align:center;margin-bottom:20px">Resetovanje lozinke</h2>
    <div *ngIf="msg" class="alert alert-info">{{ msg }}</div>
    <div *ngIf="errorMsg" class="alert alert-error">{{ errorMsg }}</div>

    <div *ngIf="!resetToken">
      <div class="form-group">
        <label>Unesite email adresu</label>
        <input type="email" [(ngModel)]="email" placeholder="email@example.com">
      </div>
      <button class="btn btn-primary btn-block" (click)="requestReset()" [disabled]="loading">
        {{ loading ? 'Slanje...' : 'Pošalji link za reset' }}
      </button>
    </div>

    <div *ngIf="resetToken">
      <div class="form-group">
        <label>Token za reset</label>
        <input type="text" [(ngModel)]="resetToken" placeholder="Unesite token">
      </div>
      <div class="form-group">
        <label>Nova lozinka</label>
        <input type="password" [(ngModel)]="newPassword" placeholder="8-12 karaktera">
      </div>
      <button class="btn btn-success btn-block" (click)="resetPassword()" [disabled]="loading">
        {{ loading ? 'Promena...' : 'Promeni lozinku' }}
      </button>
    </div>

    <p style="text-align:center;margin-top:16px">
      <a routerLink="/login" style="color:var(--primary)">← Nazad na prijavu</a>
    </p>
  </div>
</div>

<footer class="app-footer"><p>&copy; 2025 SportSphere Hub.</p></footer>
